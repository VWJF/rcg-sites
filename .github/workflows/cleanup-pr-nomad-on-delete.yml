# Reusable Nomad preview cleanup on branch delete.
# Site repos keep a thin `on: delete` entrypoint that calls this workflow.
# Standalone `on: delete` remains for direct use in this repo or vendored copies.
#
# Decap CMS closePR then deleteBranch; GitHub may skip pull_request/closed in
# pages-gh.yml if it cannot build a merge commit. delete entrypoints on the
# default branch still run.
name: Cleanup Nomad preview on branch delete

on:
  delete:

  workflow_call:
    inputs:
      deleted_ref:
        description: Deleted branch name (github.event.ref from the caller's delete event).
        type: string
        required: true
      ref_type:
        description: github.event.ref_type from the caller (branch or tag).
        type: string
        required: false
        default: branch

jobs:
  cleanup-pr-nomad:
    if: >
      vars.ENABLE_NOMAD == 'true' &&
      (
        (github.event_name == 'workflow_call' && inputs.ref_type == 'branch') ||
        (github.event_name == 'delete' && github.event.ref_type == 'branch')
      )
    permissions:
      pull-requests: read
    environment:
      name: docker-image
    runs-on: ${{ vars.RUNS_ON == '' && 'ubuntu-latest' || (startsWith(vars.RUNS_ON, '[') && fromJSON(vars.RUNS_ON) || vars.RUNS_ON) }}
    env:
      NOMAD_VERSION: ${{ vars.NOMAD_VERSION || '1.11.1' }}
      SERVICE: "${{ vars.__SERVICE__ }}"
      NOMAD_NAMESPACE: "${{ vars.__NAMESPACE__ }}"
    steps:
      # Checkout this workflow's repo (not the caller) so find-closed-pr.sh is available.
      # github.workflow_sha is the commit of the reusable workflow when called via workflow_call.
      - name: Checkout rcg-sites (find-closed-pr.sh)
        uses: actions/checkout@v5
        with:
          repository: VWJF/rcg-sites
          ref: ${{ github.workflow_sha }}
          sparse-checkout: |
            .github/actions/cleanup-pr-nomad-job
          sparse-checkout-cone-mode: false

      - name: Find closed PR for deleted branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DELETED_REF: ${{ github.event_name == 'workflow_call' && inputs.deleted_ref || github.event.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: bash "${GITHUB_WORKSPACE}/.github/actions/cleanup-pr-nomad-job/find-closed-pr.sh"

      - name: Cleanup Nomad jobs for deleted PR branch
        if: steps.pr.outputs.pr_number != ''
        uses: ./.github/actions/cleanup-pr-nomad-job
        with:
          job_name: ${{ env.SERVICE }}-pr-${{ steps.pr.outputs.pr_number }}-
          nomad_version: ${{ env.NOMAD_VERSION }}
          nomad_token: ${{ secrets.NOMAD_SERVER_TOKEN }}
          nomad_addr: ${{ secrets.NOMAD_SERVER_ADDRESS }}
          nomad_namespace: ${{ env.NOMAD_NAMESPACE }}
          allow_missing: 'true'
