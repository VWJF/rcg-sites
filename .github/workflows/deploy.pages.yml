# Leaf: deploy Pages artifact from build.pages.yml (same workflow run).
# Caller must needs: the build.pages job. Do not nest behind another reusable.
name: Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      event_name:
        description: Original caller event (push, pull_request, workflow_dispatch).
        type: string
        required: true
      event_action:
        description: Original pull_request action (opened, synchronize, closed, …).
        type: string
        required: false
        default: ''
      enable_github_pages:
        description: Force-on override when repo var ENABLE_GITHUB_PAGES is unset/false. Default false.
        type: boolean
        required: false
        default: false
      runs_on:
        description: Runner label (ubuntu-latest) or JSON array (["self-hosted","rcg"]). Empty defaults to ubuntu-latest.
        type: string
        required: false
        default: ''

jobs:
######################################################
## Deploy staging site to GitHub Pages            ##
######################################################

  deploy-github-pages:
    # Skip Pages if PR is closed so a discarded draft is not published to github.io
    if: (vars.ENABLE_GITHUB_PAGES == 'true' || inputs.enable_github_pages) && (inputs.event_name != 'pull_request' || inputs.event_action != 'closed')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: write
      id-token: write
      pages: write
    runs-on: ${{ inputs.runs_on == '' && 'ubuntu-latest' || (startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on) }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
