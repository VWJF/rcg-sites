# Leaf: build Hugo site and upload Pages artifact.
# Called by the site dispatcher (sample: site.dispatch.yml). Do not nest behind another reusable.
name: Build GitHub Pages

on:
  workflow_call:
    inputs:
      timestamp:
        description: Shared run timestamp (for logs).
        type: string
        required: false
        default: ''
      repo_name:
        description: Repository name without owner (safe.directory / workspace).
        type: string
        required: true
      event_name:
        description: Original caller event (push, pull_request, workflow_dispatch).
        type: string
        required: true
      event_action:
        description: Original pull_request action (opened, synchronize, closed, …).
        type: string
        required: false
        default: ''
      enable_github_pages:
        description: Force-on override when repo var ENABLE_GITHUB_PAGES is unset/false. Default false.
        type: boolean
        required: false
        default: false
      runs_on:
        description: Runner label (ubuntu-latest) or JSON array (["self-hosted","rcg"]). Empty defaults to ubuntu-latest.
        type: string
        required: false
        default: ''

jobs:
######################################################
## Build and publish a staging site to GitHub Pages ##
######################################################

  # Build job
  build-github-pages:
    # Skip Pages if PR is closed so a discarded draft is not published to github.io
    if: (vars.ENABLE_GITHUB_PAGES == 'true' || inputs.enable_github_pages) && (inputs.event_name != 'pull_request' || inputs.event_action != 'closed')
    
    runs-on: ${{ inputs.runs_on == '' && 'ubuntu-latest' || (startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on) }}
    container:
      #  If Setup Pages ever fails for lack of Node, the fix is to drop the job-level container and keep only the Hugo action.
      image: peaceiris/hugo

    env:
      HUGO_VERSION: "${{ vars.HUGO_VERSION }}" # 0.170.0 — LibSass removed; Dart Sass required for css.Sass
      DART_SASS_VERSION: "${{ vars.DART_SASS_VERSION || '1.93.2' }}"
      HUGO_FORMS: ${{ vars.HUGO_FORMS }}
      HUGO_SERVICES_GOOGLEANALYTICS_ID: ${{ vars.HUGO_SERVICES_GOOGLEANALYTICS_ID }}
      REPO_NAME: ${{ inputs.repo_name }}

    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      contents: read
      pages: read
    
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_VERSION }}
          # Hugo 0.170+: single binary (extended alias still published). LibSass is gone.
          extended: true

      # Hugo 0.170 removed LibSass; css.Sass (e.g. Ananke) needs the Dart Sass binary on PATH.
      # Prefer dart-sass-gha (standalone release) over snap (confinement breaks Hugo cache/temp).
      - name: Install Dart Sass
        uses: dw-labs-org/dart-sass-gha@v1
        with:
          version: ${{ env.DART_SASS_VERSION }}

      - name: Pre-Build ls
        run: |
          ls -lah
          echo "${{ inputs.timestamp }}" from env
          echo "${{ steps.pages.outputs.base_url }}/" from env

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive) # failing on ubuntu container
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
          # set-safe-directory: '/__w/coastal-science.github.io/coastal-science.github.io' # The process '/usr/bin/git' failed with exit code 128
          # set-safe-directory: '/__w/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}' # The process '/usr/bin/git' failed with exit code 128, resorting to manual call
          
      - name: Set safe directory workaround
        run: |
          git config --global --add safe.directory /__w/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}
          
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: staging
          HUGO_ENV: staging
          HUGO_CI_SHORT_SHA: ${{ github.sha }}
          HUGO_CI_AUTHOR: ${{ github.actor }}
        run: |
          hugo \
            --gc \
            --buildDrafts \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
            
      - name: Post-Build ls
        run: ls -lah public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
